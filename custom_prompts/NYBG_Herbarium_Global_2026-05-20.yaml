  - catalogNumber
  - barcodes
  - collectedBy
  - collectedByStandardized
  - collectedBySurname
  - collectorIrn
  - additionalCollectors
  - collectorNumberVerbatim
  - collectorNumberPrefix
  - collectorNumberOnly
  - collectorNumberSuffix
  - verbatimCollectionDate
  - collectionDate
  - collectionDateEnd
  - collectionNotes
  LOC1:
  - continent
  - country
  - countryISO
  - stateProvince
  - stateProvinceISO
  - county
  - countyISO
  - locality
  - locationNotes
  - cultivated
  LOC2:
